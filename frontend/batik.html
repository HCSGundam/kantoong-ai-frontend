<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanti Gold - AI Chat</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/chat-panel.css">
    <link rel="stylesheet" href="css/input-bar.css">
    <link rel="stylesheet" href="css/chat-bubble.css">
</head>
<body>
    <div class="mobile-container">
        <div class="bg-image"></div>
        <header class="app-header">
            <div class="header-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg><span>Menu</span></div>
            
            <!-- Menggunakan ID agar bisa diubah otomatis oleh Backend -->
            <div class="header-title" id="app-title">YANTI GOLD</div>
            
            <div class="header-right">
                <div class="header-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>Search</span></div>
                <div class="header-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>Bag</span></div>
            </div>
        </header>

        <!-- TOMBOL ORB AI & GELOMBANG -->
        <div class="logo-btn-bulat" id="logoBtn">
            <div id="logoText" class="ai-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div id="logoDots" class="listening-dots" style="display: none;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <!-- FLOATING INPUT BAR -->
        <div class="input-bar-container floating-mode" id="floatingInputBar" style="display: none;">
            <div class="input-box auto-expand">
                <svg class="icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                <textarea rows="1" placeholder="Ketik pesan..." id="kolomKetikFloating"></textarea>
                <svg class="icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
            </div>
            <button class="send-btn" id="tombolKirimFloating">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>

        <!-- PANEL KACA UTAMA -->
        <div class="chat-panel panel-half" id="chatPanel">
            <div class="drag-handle" id="dragHandle"></div>
            <div class="chat-header">
                <h2>Chat</h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="19" r="2.5"/></svg>
            </div>

            <div class="chat-box" id="chatBox"></div>

            <div class="input-bar-container">
                <div class="input-box auto-expand">
                    <svg class="icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    <textarea rows="1" placeholder="Ketik pesan..." id="kolomKetik"></textarea>
                    <svg class="icon-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                </div>
                <button class="send-btn" id="tombolKirim">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- PEMANGGILAN SCRIPT LENGKAP -->
    <script src="js/batik-config.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/ai-brain.js"></script> 
</body>
</html>
